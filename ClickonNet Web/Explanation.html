<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<title>ClickonNet</title>

		<style>
			body {
				background-image: url("ClickonNet.jpg");
				background-size: cover;
				background-position: center;
				background-repeat: no-repeat;
				background-attachment: fixed;
				margin: 0;
				min-height: 100vh;
				font-family: Arial, sans-serif;
			}

			#dark-overlay {
				position: fixed;
				top: 0;
				left: 0;
				width: 100vw;
				height: 100vh;
				background-color: #121212;
				opacity: 0;
				pointer-events: none;
				transition: opacity 0.5s ease-in-out;
				z-index: 50; 
			}

			#dark-overlay.active {
				opacity: 1;
				pointer-events: auto;
			}

			.logo-btn {
				position: absolute;
				top: 15px;
				left: 15px;
				background: none;
				border: none;
				padding: 0;
				cursor: pointer;
				z-index: 100;
			}

			.fade-wrapper {
				transition: opacity 0.5s ease-in-out;
				opacity: 1;
			}

			.fade-wrapper.fade-out {
				opacity: 0;
			}

			.nav-container {
				position: absolute;
				left: 240px;
				top: auto;
				display: flex;
				gap: 15px;
				justify-content: space-between;
				z-index: 100;
			}

			.nav-btn {
				padding: 46px 20px;
				background-color: rgb(255, 255, 255);
				color: black;
				text-decoration: none;
				border-radius: 0px;
				font-weight: bold;
				font-size: 14px;
				cursor: pointer;
				border: none;
				transition: background-color 0.3s ease, color 0.3s ease, transform 0.1s ease;
			}

			.nav-btn:hover {
				background-color: #0056b3;
				color: white;
				box-shadow: 0 0 10px rgba(135, 206, 250, 0.8),
							0 0 20px rgba(135, 206, 250, 0.6),
							0 0 30px rgba(135, 206, 250, 0.4);
			}

			.nav-btn:active {
				transform: scale(0.98);
			}

			.nav-btn.active-highlight {
				background-color: #0056b3 !important;
				color: white !important;
			}

			.pccomponents {
				position: absolute;
				z-index: 100;
			}

			.hidden {
				display: none !important;
			}

			html, body {
				overflow-x: hidden;
				margin: 0;
			}

			.arrow-btn {
				position: fixed;
				top: 400px;
				width: 52px;
				height: 48px;
				padding: 0;
				display: flex;
				justify-content: center;
				align-items: center;
				background: #ffffff;
				border: 1px solid #aaaaaa;
				border-radius: 2px;
				cursor: pointer;
				overflow: hidden;
				z-index: 9999;
				transition: background 0.25s ease,
							box-shadow 0.25s ease,
							border-color 0.25s ease,
							transform 0.2s ease;
			}

			.arrow-btn span {
				display: inline-block;
				color: #111111;
				font-size: 35px;
				font-weight: bold;
				line-height: 1;
			}

			.arrow-btn.left span {
				animation: arrow-left 1.2s ease-in-out infinite;
			}

			.arrow-btn.right span {
				animation: arrow-right 1.2s ease-in-out infinite;
			}

			@keyframes arrow-left {
				0%, 100% { transform: translateX(0); }
				50% { transform: translateX(-5px); }
			}

			@keyframes arrow-right {
				0%, 100% { transform: translateX(0); }
				50% { transform: translateX(5px); }
			}

			.arrow-btn:hover {
				background: #0056b3;
				border-color: #1685ff;
				box-shadow: 0 0 12px #1685ff,
							0 0 25px rgba(22, 133, 255, 0.5);
			}

			.arrow-btn:hover span {
				color: #ffffff;
			}

			.arrow-btn:active {
				transform: scale(0.85);
			}

			.arrow-btn:focus-visible {
				outline: 2px solid #66b2ff;
				outline-offset: 4px;
			}

			/* Text Containers Styling */
			.model-text-box {
				background-color: rgba(0, 0, 0, 0.7);
				color: rgb(255, 255, 255);
				padding: 15px;
				box-sizing: border-box;
				margin: 0;
				text-align: center;
			}
			
			/* 3D Container Styling inherited from Sandbox */
			.model-container {
				width: 500px;
				height: 500px;
				background-color: #222;
				border: 2px solid #444;
				border-radius: 8px;
				overflow: hidden;
				position: absolute;
			}
		</style>

		<!-- Import Three.js and OrbitControls via CDN -->
		<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
		<!-- GLTFLoader for loading external 3D assets (.gltf / .glb) -->
		<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
	</head>

	<body>

		<!-- Dark Background Overlay -->
		<div id="dark-overlay"></div>

		<!-- Logo -->
		<button class="logo-btn" onclick="resetToHome()">
			<img src="Logo.jpg" width="200" alt="ClickonNet Logo">
		</button>

		<!-- Navigation Buttons -->
		<div id="nav-border" class="nav-container">
			<button class="nav-btn" onclick="transitionTo(this, 'components')">PC Components</button>
			<button class="nav-btn" onclick="transitionTo(this, 'hazards')">Hazards</button>
			<button class="nav-btn" onclick="transitionTo(this, 'assembly')">PC Assembly</button>
		</div>
		
		<!-- UI Elements that Fade Out -->
		<div id="page-ui" class="fade-wrapper">
			<hr id="nav-line" style="position: absolute; left: 0; width: 100vw; border: none; border-top: 2px solid #000; margin: 0;">
		</div>

		<!-- Descriptions and Names for the 3D models -->
		<div id="descriptions" class="pccomponents hidden">
			
			<h1 id="text-comp-name" class="model-text-box" style="position:absolute; top:130px; left:500px; width: 500px;">Component Name</h1>
			<p id="text-comp-desc" class="model-text-box" style="position:absolute; top:720px; left:500px; width: 500px; font-size: 18px; line-height: 1.5;">Component Description</p>
			
		</div>

		<!-- The 3D Preview Sections -->
		<div id="pc-components-section" class="pccomponents hidden">
			
			<button class="arrow-btn left left-arrow-btn" style="left:250px;" onclick="change(-1)" aria-label="Previous PC component"><span>❮</span></button>
			<div id="3d-container-components" class="model-container" style="top:200px; left:500px;"></div>
			<button class="arrow-btn right" style="left:1200px;" onclick="change(1)" aria-label="Next PC component"><span>❯</span></button>

		</div>

		<!-- Main JavaScript Application Logic -->
		<script>
			// --- DATA FOR 3D MODELS ---
			const pcParts = [
				{
					file: 'models/cpu.glb',
					name: 'Central Processing Unit (CPU)',
					description: 'The CPU acts as the brain of the computer, processing instructions, performing calculations, and managing the flow of information through the system.'
				},
				{
					file: 'models/ram.glb',
					name: 'Random Access Memory (RAM)',
					description: 'RAM provides high-speed, short-term memory for the PC, storing data that the CPU needs immediate access to while applications are running.'
				},
				{
					file: 'models/CHICKEN.glb',
					name: 'Easter Egg Chicken',
					description: 'Just a random 3D chicken floating in cyberspace. A placeholder for a future PC component.'
				}
			];

			let i = 0;

			// --- THREE.JS VIEWERS ---
			const loader = new THREE.GLTFLoader();
			function createModelViewer(containerId) {
				const container = document.getElementById(containerId);
				const scene = new THREE.Scene();
				scene.background = new THREE.Color(0x1a1a1a);
				scene.add(new THREE.GridHelper(10, 10));
				scene.add(new THREE.AxesHelper(5));

				const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
				camera.position.set(0, 2, 5);

				const renderer = new THREE.WebGLRenderer({ antialias: true });
				renderer.setSize(500, 500);
				renderer.setPixelRatio(window.devicePixelRatio);
				container.appendChild(renderer.domElement);

				scene.add(new THREE.AmbientLight(0xffffff, 0.8));
				scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.5));
				const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
				dirLight.position.set(5, 10, 7);
				scene.add(dirLight);

				const controls = new THREE.OrbitControls(camera, renderer.domElement);
				controls.enableDamping = true;
				controls.dampingFactor = 0.05;

				let currentMesh = null;
				let loadVersion = 0;

				function load(partData) {
					const version = ++loadVersion;
					if (currentMesh) {
						scene.remove(currentMesh);
						currentMesh = null;
					}

					loader.load(
						partData.file,
						function (gltf) {
							if (version !== loadVersion) return;

							currentMesh = gltf.scene;
							const box = new THREE.Box3().setFromObject(currentMesh);
							const size = box.getSize(new THREE.Vector3());
							const maxDim = Math.max(size.x, size.y, size.z);

							if (maxDim > 0) {
								const scale = 3 / maxDim;
								currentMesh.scale.set(scale, scale, scale);
							}

							currentMesh.updateMatrixWorld(true);
							const center = new THREE.Box3()
								.setFromObject(currentMesh)
								.getCenter(new THREE.Vector3());
							currentMesh.position.sub(center);
							scene.add(currentMesh);

							controls.target.set(0, 0, 0);
							controls.update();
						},
						undefined,
						function (error) {
							console.error('An error occurred loading the model:', error);
						}
					);
				}

				function render() {
					if (currentMesh) currentMesh.rotation.y += 0.005;
					controls.update();
					renderer.render(scene, camera);
				}

				return { load, render };
			}

			const componentViewer = createModelViewer('3d-container-components');

			function animate() {
				requestAnimationFrame(animate);
				componentViewer.render();
			}
			animate();

			// --- MODEL LOADING AND TEXT UPDATING ---
			function loadModelData(index) {
				const partData = pcParts[index];

				// 1. Update text fields based on which tab is open
				document.getElementById('text-comp-name').innerText = partData.name;
				document.getElementById('text-comp-desc').innerText = partData.description;

				componentViewer.load(partData);
			}

			// Arrow click logic (Limits logic preserved entirely)
			function change(n) {
				i = i + n;

				if (i >= pcParts.length) i = pcParts.length - 1;
				if (i < 0) i = 0;

				loadModelData(i);
			}

			// --- UI TRANSITIONS ---
			function alignNavLine() {
				const nav = document.getElementById('nav-border');
				const line = document.getElementById('nav-line');
				if (nav && line) {
					const rect = nav.getBoundingClientRect();
					line.style.top = (rect.bottom + window.scrollY) + 'px';
				}
			}

			function transitionTo(btnElement, targetSection) {
				document.querySelectorAll('.nav-btn').forEach(btn => {
					btn.classList.remove('active-highlight');
				});

				btnElement.classList.add('active-highlight');
				document.getElementById('page-ui').classList.add('fade-out');
				document.getElementById('dark-overlay').classList.add('active');

				if (targetSection === 'components') {
					document.getElementById('pc-components-section').classList.remove('hidden');
					document.getElementById('descriptions').classList.remove('hidden');
				} else {
					document.getElementById('pc-components-section').classList.add('hidden');
					document.getElementById('descriptions').classList.add('hidden');
				}

				// Always refresh the text and model for the newly opened tab
				loadModelData(i);
			}

			function resetToHome() {
				document.querySelectorAll('.nav-btn').forEach(btn => {
					btn.classList.remove('active-highlight');
				});
				document.getElementById('dark-overlay').classList.remove('active');
				document.getElementById('page-ui').classList.remove('fade-out');
				document.getElementById('pc-components-section').classList.add('hidden');
				document.getElementById('descriptions').classList.add('hidden');
			}
			
			window.addEventListener('load', () => {
				alignNavLine();
				loadModelData(i); // Initial preload of model 0
			});
			window.addEventListener('resize', alignNavLine);

		</script>
	</body>
</html>
