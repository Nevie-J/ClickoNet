<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>ClickonNet</title>
		<link rel="stylesheet" href="VClickonNet.css">
		<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
		<script src="VClickonNet.js" defer></script>
	</head>

	<body>
		<div id="dark-overlay"></div>

		<button class="logo-btn" type="button" aria-label="Return to home">
			<img src="Logo.jpg" width="200" alt="ClickonNet Logo">
		</button>

		<div id="nav-border" class="nav-container">
			<button class="nav-btn" type="button" data-section="components">PC Components</button>
			<button class="nav-btn" type="button" data-section="hazards">Hazards</button>
			<button class="nav-btn" type="button" data-section="assembly">PC Assembly</button>
		</div>

		<div id="page-ui" class="fade-wrapper">
			<hr id="nav-line">
		</div>

		<div id="descriptions" class="pccomponents hidden">
			<h1 id="text-comp-name" class="model-text-box">Component Name</h1>
			<p id="text-comp-desc" class="model-text-box">Component Description</p>
		</div>

		<div id="pc-components-section" class="pccomponents hidden">
			<button class="arrow-btn left left-arrow-btn" type="button" data-change="-1" aria-label="Previous PC component">
				<span>❮</span>
			</button>
			<div id="3d-container-components" class="model-container"></div>
			<button class="arrow-btn right" type="button" data-change="1" aria-label="Next PC component">
				<span>❯</span>
			</button>
		</div>

		<div id="pc-assembly-section" class="pccomponents hidden">
			<iframe src="https://mytekdev.com/try/pcworkshop?embed=1" title="PC Workshop demo from mytekDev" allow="fullscreen"></iframe>
		</div>
	</body>
</html>
